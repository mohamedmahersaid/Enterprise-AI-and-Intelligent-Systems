name: Live validation

# Runs what the other workflows cannot: the curriculum against live services.
# It needs the network and minutes of runner time, so it runs on the pull
# requests that change what it tests, weekly, and on demand - not on every
# pull request. A passing run is evidence; recording it in
# data/validation.json, and so promoting a leaf to validated, is a reviewed
# pull request, never something this workflow does.
#
# The paths below must list every leaf that has a data/live spec, and its
# fixtures directory when the spec copies one - validate-content fails a pull
# request whose spec is missing from this filter, because the filter is static
# YAML and a leaf the matrix knows but the filter does not would never run on
# the pull request that edits it.
on:
  pull_request:
    paths:
      - data/live/**
      - scripts/live-run.mjs
      - scripts/live-matrix.mjs
      - scripts/lib/live-spec.mjs
      - docs/ai-tree-model-platforms/ai-branch-local-inference/ai-ollama-local-inference.md
      - docs/ai-tree-operations-governance/ai-branch-llmops-observability/ai-what-to-log.md
      - docs/ai-tree-applied-systems/ai-branch-agents-integration/ai-do-you-need-an-agent.md
      - docs/ai-tree-production-systems/ai-branch-agent-runtime-cost/ai-agent-memory-context.md
      - docs/ai-tree-production-systems/ai-branch-retrieval-evaluation/ai-retrieval-test-collections.md
      - docs/ai-tree-production-systems/ai-branch-retrieval-evaluation/fixtures/**
      - docs/ai-tree-applied-systems/ai-branch-rag-knowledge/ai-document-multimodal-ingestion.md
      - docs/ai-tree-applied-systems/ai-branch-rag-knowledge/fixtures/**
      - docs/ai-tree-platform-engineering/ai-branch-model-feature-lifecycle/ai-feature-store-skew.md
      - docs/ai-tree-platform-engineering/ai-branch-model-feature-lifecycle/ai-reproducible-training-runs.md
      - docs/ai-tree-platform-engineering/ai-branch-model-feature-lifecycle/ai-model-supply-chain.md
      - docs/ai-tree-platform-engineering/ai-branch-model-feature-lifecycle/fixtures/**
      - .github/workflows/live.yml
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama release to install, e.g. 0.34.4 (the default is the version the recorded evidence used)'
        required: false
        default: '0.34.4'

# Read-only, and no job here holds a secret: live-run.mjs executes the
# leaves' commands, which is safe exactly while no job in this workflow gets
# a token or a secret - keep it that way in review. The registry check for
# pinned model tags is in model-tags.yml, which runs on every leaf change
# because it takes seconds.
permissions:
  contents: read

# A newer push to a pull request supersedes its run; a scheduled or manual run
# on main is evidence and is never cancelled by the other.
concurrency:
  group: live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per data/live spec: a new spec joins the run by existing. The
  # matrix carries each leaf's needs so the leg below installs only what the
  # leaf declares.
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - id: list
        run: node scripts/live-matrix.mjs --github

  # ubuntu-24.04 by name, not ubuntu-latest: 'validated' evidence must not
  # silently change operating system when the label moves.
  leaf:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    name: ${{ matrix.leaf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The manual install from Ollama's Linux documentation, not install.sh:
      # the script registers a systemd service that would already hold port
      # 11434 when a leaf's own server starts. Only for leaves that declare
      # the ollama need.
      #
      # The version defaults to the one the recorded evidence in
      # data/validation.json used, so pull-request and scheduled runs test the
      # exact release the leaf is validated against, not whatever shipped last
      # night; bump the default when a new pass is recorded. The asset comes
      # from the GitHub release, not ollama.com, because only the release
      # publishes sha256sum.txt, and sha256sum -c verifies the bytes against
      # it before anything is unpacked into /usr. The current release is
      # exercised by the ollama-latest-drift job below.
      - name: Install Ollama
        if: contains(matrix.needs, 'ollama')
        env:
          OLLAMA_VERSION: ${{ inputs.ollama_version || '0.34.4' }}
        run: |
          base="https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}"
          curl -fsSLO "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL "$base/sha256sum.txt" \
            | grep -E ' \./ollama-linux-amd64\.tar\.zst$' | sha256sum -c -
          zstd -d < ollama-linux-amd64.tar.zst | sudo tar -x -C /usr
          rm ollama-linux-amd64.tar.zst
          ollama -v

      # Runs the leaf's own command blocks, in order, and fails at the first
      # command whose exit status or output does not match its data/live spec.
      - name: Run the leaf's commands
        run: node scripts/live-run.mjs ${{ matrix.leaf }} --json live-run.json

      - name: Print the run report
        if: always()
        run: |
          if [ -f live-run.json ]; then
            # The last lines each command printed, so the evidence can be read
            # rather than taken on trust.
            jq '.steps[].output |= (split("\n") | map(select(length > 0)) | .[-8:])' live-run.json
          else
            echo "No report: the run stopped before writing one."
          fi

      # The full report, kept with the run itself, so a data/validation.json
      # record can be checked against what the run actually did rather than
      # against a bare URL.
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-run-${{ matrix.leaf }}
          path: live-run.json
          if-no-files-found: ignore

  # Experimental: the Ollama leaf against the current Ollama release, weekly,
  # so the pinned default above ages loudly rather than silently. Its outcome
  # is never evidence - data/validation.json records only the pinned job - so
  # it uploads no artifact, and continue-on-error keeps a drift failure from
  # marking the scheduled run red; what it leaves is a readable log.
  ollama-latest-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Same download-and-verify as the pinned job, with the tag resolved from
      # the latest GitHub release; the repository is public, so the API call
      # is unauthenticated and no token enters this job.
      - name: Install the current Ollama release
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest | jq -r .tag_name)
          echo "Current release: $tag"
          base="https://github.com/ollama/ollama/releases/download/${tag}"
          curl -fsSLO "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL "$base/sha256sum.txt" \
            | grep -E ' \./ollama-linux-amd64\.tar\.zst$' | sha256sum -c -
          zstd -d < ollama-linux-amd64.tar.zst | sudo tar -x -C /usr
          rm ollama-linux-amd64.tar.zst
          ollama -v

      - name: Run the Ollama leaf's commands
        run: node scripts/live-run.mjs ai-ollama-local-inference --json live-run.json

      - name: Print the run report
        if: always()
        run: |
          if [ -f live-run.json ]; then
            jq '.steps[].output |= (split("\n") | map(select(length > 0)) | .[-8:])' live-run.json
          else
            echo "No report: the run stopped before writing one."
          fi

  # Separate job so the token that can write issues never shares a job with
  # the leaf's executed commands, the same split as links.yml. The issue text
  # is a fixed template plus the run id from the github context - nothing the
  # leaf-running job printed or output is interpolated into it.
  report:
    needs: leaf
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failed-run issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled live validation failed"
          body=$(printf 'The weekly live run failed for at least one leaf. Read the run log: if a command has genuinely regressed, record a fail run in data/validation.json in a pull request so the leaf is demoted; if the runner flaked, re-run the workflow and close this when it passes.\n\nFailed run: %s\n' "$RUN_URL")
          # Only an issue this workflow opened, with exactly this title: anyone can
          # open an issue with a similar name, and the report must not land on it.
          existing=$(gh issue list --state open --author app/github-actions --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
