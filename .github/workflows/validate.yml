name: Validate curriculum

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag: a tag can be moved
      # to point at different code, a SHA cannot. The trailing comment records
      # which release each SHA corresponds to so it can be reviewed and bumped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # validate:scripts executes leaf code; leave no token in .git/config for it.
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests for the validators themselves, on small fixtures: a rule that
      # silently stops firing passes against the corpus, so only a test sees it.
      - name: Test the validators
        run: npm test

      # Fails on a high or critical advisory in the toolchain. Two high-severity
      # advisories once sat in these logs unnoticed because nothing failed on them.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The leaf scripts' lightweight dependencies, pinned and hash-checked, in a
      # venv so the runner's system Python is left alone.
      - name: Install leaf script dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/leaf-python"
          "$RUNNER_TEMP/leaf-python/bin/pip" install --require-hashes -r scripts/requirements.txt
          echo "LEAF_PYTHON=$RUNNER_TEMP/leaf-python/bin/python" >> "$GITHUB_ENV"

      - name: Validate structure, catalog and README figures
        run: npm run validate:content

      # Renders every derived file in memory and byte-compares it with the
      # tree, so a hand edit to a generated file cannot merge.
      - name: Check derived files against regeneration
        run: npm run validate:regen

      - name: Parse every mermaid diagram
        run: npm run validate:mermaid

      # The leaves ship scripts readers copy and run. Compiling them here keeps
      # a syntax error from reaching readers, and every third-party import must
      # be declared by the leaf; nothing is executed.
      - name: Compile every python block
        run: npm run validate:python

      # Compiling is not working. Runs each block bare, as a reader first will,
      # and fails on a traceback; scripts needing an uninstalled dependency are
      # listed as skipped by name.
      - name: Run every python block
        run: npm run validate:scripts

      # Textual only, nothing is executed. Guards the command blocks against
      # literal credentials, destructive operations and placeholder drift.
      - name: Check every command block
        run: npm run validate:commands

      - name: Lint markdown
        run: npm run lint:md

      # The site generator reads the catalog and every leaf, so a build failure
      # here catches a structural break that the other checks would not.
      - name: Build the site
        run: npm run build:site

  # The job above installs only the lightweight dependencies, so three scripts
  # are skipped there - and a traceback in one of them went unnoticed because
  # nothing ever started it with its dependency present. This job installs every
  # dependency a leaf declares and fails on any skip, so every script is run.
  scripts-all-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # validate:scripts executes leaf code; leave no token in .git/config for it.
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install every leaf script dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/leaf-python"
          "$RUNNER_TEMP/leaf-python/bin/pip" install --require-hashes -r scripts/requirements-full.txt
          echo "LEAF_PYTHON=$RUNNER_TEMP/leaf-python/bin/python" >> "$GITHUB_ENV"

      - name: Run every python block, none skipped
        run: npm run validate:scripts -- --require-all

  # Confirms every run recorded in data/validation.json against the GitHub
  # API: conclusion, workflow path, event, branch and commit - what no offline
  # check can prove. Its own job with `permissions: {}`, because it executes
  # the pull request's own copy of the script: checking out PR code here is
  # acceptable exactly because the job holds no token and no secret (empty
  # permissions, persist-credentials: false), so that code has nothing to take
  # or write, and the script makes only unauthenticated GETs - the repository
  # is public. Plain node with no dependencies, so no npm ci here. On a
  # persistent API rate limit the script warns and passes on pull requests
  # only; the push run on main still fails, so a bad record cannot land quietly.
  verify-validation:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify validation records against the GitHub API
        run: node scripts/verify-validation.mjs
