name: Validate curriculum

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag: a tag can be moved
      # to point at different code, a SHA cannot. The trailing comment records
      # which release each SHA corresponds to so it can be reviewed and bumped.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structure, catalog and README figures
        run: npm run validate:content

      - name: Parse every mermaid diagram
        run: npm run validate:mermaid

      - name: Lint markdown
        run: npm run lint:md
