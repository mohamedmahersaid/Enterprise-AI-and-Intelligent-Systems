name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job is granted the Pages permissions:
# the build job runs `npm run validate`, which executes the leaf scripts, and
# code that runs must not share a job with a token that can publish.
permissions:
  contents: read

# One deployment at a time. Queued rather than cancelled, so a push that lands
# during a deploy still publishes rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build takes seconds and the validation a few minutes; do not let a
    # hung step hold a runner for the six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit SHA rather than a tag: a tag can be moved
      # to point at different code, a SHA cannot. The trailing comment records
      # which release each SHA corresponds to so it can be reviewed and bumped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site is derived from the catalog, so publishing content that fails
      # validation would put known-broken pages in front of readers.
      - name: Validate before publishing
        run: npm run validate

      - name: Build the site
        run: npm run build:site

      # actions/configure-pages is deliberately NOT used. Its only outputs are
      # base_url and base_path, and this site needs neither: every link the
      # generator emits is relative, so the pages work from any prefix. The
      # step was the sole point of failure across seven runs, reading the Pages
      # API and getting Not Found even with the source set to GitHub Actions;
      # deploy-pages below creates the deployment directly.
      #
      # Both Pages actions are on v5, which moves them off the deprecated Node
      # 20 runtime: deploy-pages runs on node24 directly, and this one is a
      # composite whose inner actions/upload-artifact went 4.6.2 (node20) to
      # 7.0.0 (node24). Inputs are unchanged across the major bump - the path
      # input below and the page_url output the deploy job reads both still
      # exist in v5.
      #
      # Not yet observed to deploy successfully: publishing is blocked by a
      # repository-side Pages fault that predates this bump, so a green run
      # here proves the build half only.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # The deploy job below is skipped until the owner sets PAGES_ENABLED, so
      # say so where someone reading a green run will look, rather than letting
      # the skip pass silently as if the site had published.
      - name: Note when deployment is skipped
        if: vars.PAGES_ENABLED != 'true'
        run: |
          echo 'The site was built but NOT deployed: the repository variable PAGES_ENABLED is not `true`.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Enable Pages (Settings > Pages > Source: GitHub Actions), then set the variable (Settings > Secrets and variables > Actions > Variables > PAGES_ENABLED = true).' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # Deploying needs Pages enabled once on the repository, which this
    # workflow's token cannot do; until then every deploy got a 404 and kept
    # main permanently red, hiding real failures. Owner: enable Pages
    # (Settings > Pages > Source: GitHub Actions), then set the repository
    # variable PAGES_ENABLED to true to switch this job back on. A repository
    # variable, not a secret: nothing here is confidential.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # deploy-pages is the only step that uses these, and it runs no repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
