name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else in this workflow writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a push that lands
# during a deploy still publishes rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag: a tag can be moved
      # to point at different code, a SHA cannot. The trailing comment records
      # which release each SHA corresponds to so it can be reviewed and bumped.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site is derived from the catalog, so publishing content that fails
      # validation would put known-broken pages in front of readers.
      - name: Validate before publishing
        run: npm run validate

      - name: Build the site
        run: npm run build:site

      # actions/configure-pages is deliberately NOT used. Its only outputs are
      # base_url and base_path, and this site needs neither: every link the
      # generator emits is relative, so the pages work from any prefix. The
      # step was the sole point of failure across seven runs, reading the Pages
      # API and getting Not Found even with the source set to GitHub Actions;
      # deploy-pages below creates the deployment directly.
      #
      # Both Pages actions are on v5, which moves them off the deprecated Node
      # 20 runtime: deploy-pages runs on node24 directly, and this one is a
      # composite whose inner actions/upload-artifact went 4.6.2 (node20) to
      # 7.0.0 (node24). Inputs are unchanged across the major bump - the path
      # input below and the page_url output the deploy job reads both still
      # exist in v5.
      #
      # Not yet observed to deploy successfully: publishing is blocked by a
      # repository-side Pages fault that predates this bump, so a green run
      # here proves the build half only.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
